# Installs a release build on an Android emulator, opens it, and fails if the app crashes on launch.
# The crash, if any, is shown as an error annotation on the run.
name: Launch test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: launch-test
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      # Same release build as the published APK, but for the emulator's x86_64 processor
      - name: Build release APK for the emulator
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.eduverse.lms -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d -v brief > launch-log.txt
            adb shell pidof com.eduverse.lms > app-pid.txt || echo "" > app-pid.txt

      - name: Report result
        if: always()
        run: |
          touch launch-log.txt app-pid.txt
          crash=$(grep -A 60 -E "FATAL EXCEPTION|Fatal signal|ReactNativeJS.*(Error|Exception)|E/ReactNativeJS|SoLoader|UnsatisfiedLinkError" launch-log.txt | head -120)
          js=$(grep -E "ReactNativeJS|unknown:ReactNative" launch-log.txt | head -40)
          if [ -n "$crash" ]; then
            echo "::error title=App crash on launch::$(echo "$crash" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          if [ -n "$js" ]; then
            echo "::warning title=JavaScript log::$(echo "$js" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          if [ -s app-pid.txt ] && [ -n "$(tr -d '[:space:]' < app-pid.txt)" ]; then
            echo "App is running after 30 seconds."
          else
            echo "::error title=App not running::The app was not running 30 seconds after launch."
            exit 1
          fi

      - name: Keep the device log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-log
          path: launch-log.txt
