# Builds the Android APK on every push to main and publishes it as the latest GitHub release.
# Stable download link (used by the website's /apk page):
#   https://github.com/hamza-ahmed1/LMS_App/releases/latest/download/TCF-Campus.apk
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      # Every build gets a higher version, so phones install it as an update
      - name: Set version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # Phones only; leaving out the emulator architectures makes the build faster and the APK smaller
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TCF-Campus.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: TCF Campus 1.0.${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}: ${{ github.event.head_commit.message }}
          files: TCF-Campus.apk
          make_latest: "true"
